name: Metalogix
description: 'Metalogix was an independent software vendor providing migration, management, and
  security solutions for Microsoft SharePoint and Office 365, best known for its Content Matrix
  SharePoint-to-SharePoint migration tool. Quest Software acquired Metalogix in June 2018, and the
  metalogix.com domain now redirects to Quest, where the products live on as the Metalogix Content
  Matrix line. The tooling is delivered as a desktop console with PowerShell cmdlets that drive the
  supported SharePoint APIs; it does not publish an independent public REST API, OpenAPI definition,
  developer portal, or client SDK. This profile is retained for network/portfolio lineage.'
